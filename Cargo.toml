[workspace]
resolver = "3"
members = ["crates/media", "crates/stampede"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "suggestions"] }
crossbeam-channel = "0.5.16"
env_logger = "0.11.11"
ffmpeg-next = "9.0.0"
figment = { version = "0.10.19", features = ["env", "yaml"] }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
media = { path = "crates/media" }
