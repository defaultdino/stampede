name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install FFmpeg dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          clang \
          libavutil-dev \
          libavcodec-dev \
          libavformat-dev \
          libavdevice-dev \
          libavfilter-dev \
          libswscale-dev \
          libswresample-dev
    - name: Verify libavutil is discoverable
      run: pkg-config --modversion libavutil
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
